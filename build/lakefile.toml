# Build entry point for this repository.
#
# One Lake package that requires Mathlib at the pinned revision and exposes the in-tree
# source directories as libraries.  It follows the layout of the (unpublished) acceptance
# harness that built and audited commit 7b408ba; the package list in lake-manifest.json is
# identical to upstream/lake-manifest.json.  Usage (from this directory):
#   lake exe cache get
#   lake build QRHShort.Manuscript
name = "qrh"
defaultTargets = []

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# Small root library (QRH.Descent, QRH.Definitions, QRH.Powers, QRH.Cube).
[[lean_lib]]
name = "QRH"
srcDir = ".."

# Main development (the proof root is QRHShort.Manuscript) and its predecessor QRHLean3.
[[lean_lib]]
name = "QRHShort"
srcDir = "../stage3"

[[lean_lib]]
name = "QRHLean3"
srcDir = "../stage3"

# Third-party sources kept in-tree (see NOTICE).
[[lean_lib]]
name = "OAI"
srcDir = "../upstream"

[[lean_lib]]
name = "RellichKondrachov"
srcDir = "../upstream"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
srcDir = "../upstream"
